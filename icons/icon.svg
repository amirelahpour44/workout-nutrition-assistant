<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141126"/>
      <stop offset="50%" stop-color="#0e0c18"/>
      <stop offset="100%" stop-color="#08070d"/>
    </linearGradient>

    <!-- Center Ambient Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c6cf0" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#7c6cf0" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#7c6cf0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="greenGlow" cx="58%" cy="48%" r="35%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Neon Violet Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8a6ff"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <!-- Fresh Emerald Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonPurple" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#8b5cf6" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="18" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="neonGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#10b981" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="230" fill="url(#centerGlow)"/>
  <circle cx="295" cy="245" r="170" fill="url(#greenGlow)"/>

  <!-- Main Symbol Group -->
  <g transform="translate(256, 256)">
    <!-- Dumbbell Group -->
    <g filter="url(#neonPurple)">
      <!-- Central Grip Bar -->
      <rect x="-80" y="-12" width="160" height="24" rx="12" fill="url(#purpleGrad)"/>

      <!-- Left Weight Plates -->
      <rect x="-70" y="-75" width="28" height="150" rx="14" fill="url(#purpleGrad)"/>
      <rect x="-105" y="-55" width="24" height="110" rx="12" fill="url(#purpleGrad)"/>
      <rect x="-132" y="-35" width="18" height="70" rx="9" fill="url(#purpleGrad)"/>

      <!-- Right Weight Plates (Partially layered behind the leaf) -->
      <rect x="42" y="-75" width="28" height="150" rx="14" fill="url(#purpleGrad)"/>
      <rect x="81" y="-55" width="24" height="110" rx="12" fill="url(#purpleGrad)"/>
      <rect x="114" y="-35" width="18" height="70" rx="9" fill="url(#purpleGrad)"/>
    </g>

    <!-- Vitality Nutrition Leaf -->
    <g filter="url(#neonGreen)">
      <!-- Organic leaf shape curving across right/center -->
      <path d="M -15,75 C -15,10 40,-80 115,-80 C 115,-10 60,75 -15,75 Z" fill="url(#leafGrad)"/>
      <!-- Internal leaf rib curve -->
      <path d="M -10,70 Q 40,0 80,-50" fill="none" stroke="#e6fffa" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    </g>
  </g>
</svg>
